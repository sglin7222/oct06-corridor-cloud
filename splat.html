<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oct06 走廊高斯潑濺</title>
<style>
:root{
  --bg:#15191b; --panel:rgba(28,34,37,.92); --fg:#e8ecec; --muted:#9aa7a8; --line:#2f3a3d;
  --accent:#6fc3a6; --accent-fg:#0f1f1a; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef1f0; --panel:rgba(255,255,255,.94); --fg:#1c2420; --muted:#5d6b64; --line:#d6dedb; --accent:#1f6f5a; --accent-fg:#ffffff; color-scheme:light}}
:root[data-theme="light"]{--bg:#eef1f0; --panel:rgba(255,255,255,.94); --fg:#1c2420; --muted:#5d6b64; --line:#d6dedb; --accent:#1f6f5a; --accent-fg:#ffffff; color-scheme:light}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden}
body>canvas{position:fixed;inset:0;display:block;touch-action:none}
.card{position:fixed;z-index:5;left:16px;top:calc(16px + env(safe-area-inset-top,0px));width:min(320px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;backdrop-filter:blur(6px);font-size:13px;line-height:1.5}
.card h1{font-size:15px;margin:0 0 2px;font-weight:600}
.card .sub{color:var(--muted);font-size:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row label{color:var(--muted);font-size:12px;min-width:56px}
button,a.btn{font:inherit;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;text-decoration:none}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:focus-visible,a.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{color:var(--muted);font-size:11.5px;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
#status{position:fixed;z-index:5;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12px;font-family:var(--mono)}
.hint{position:fixed;z-index:5;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:11px;text-align:right}
@media (max-width:480px){.hint{display:none}.card{font-size:12px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="card">
  <h1>Oct06_r001 走廊高斯潑濺</h1>
  <div class="sub">同一支錄影、同一組位姿 · 162 張 → 3D Gaussian Splatting 7000 次 · 64.6 萬個高斯</div>
  <div class="row"><label>資料</label>
    <a class="btn" href="./">後處理點雲／貼圖網格</a>
    <button aria-pressed="true">後處理高斯潑濺</button></div>
  <div class="row"><label>顯示</label>
    <button id="tog-path" aria-pressed="true">相機路徑</button>
    <button id="view-start">錄影起點</button>
    <button id="view-top">俯視</button>
    <button id="view-reset">重設視角</button></div>
  <div class="note">沿錄影方向看幾乎等於照片；側轉 50°、低頭看反光地板會糊成條紋或雜訊，那些角度錄影時沒有拍到。只存基礎色，不含視角反光。</div>
</div>
<div id="status">載入中…</div>
<div class="hint">拖曳旋轉 · 右鍵/雙指平移 · 滾輪縮放</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
} }
</script>
<script type="module">
import * as THREE from 'three';
import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

const statusEl = document.getElementById('status');
function bgColor() { const v = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(); return new THREE.Color(v || '#15191b'); }

const scene = new THREE.Scene();
scene.background = bgColor();
let pathPts = [], pathObj = null, center = new THREE.Vector3(0, 1, -13), radius = 13;

const [meta, cloudMeta] = await Promise.all([
  fetch('oct06_splat.json').then(r => r.json()).catch(() => null),
  fetch('oct06_cloud.json').then(r => r.json()).catch(() => null),
]);
if (meta) {
  const box = new THREE.Box3(new THREE.Vector3().fromArray(meta.min), new THREE.Vector3().fromArray(meta.max));
  box.getCenter(center); radius = box.getSize(new THREE.Vector3()).length() / 2;
}
if (cloudMeta && cloudMeta.path) {
  pathPts = cloudMeta.path.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  pathObj = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pathPts), new THREE.LineBasicMaterial({ color: 0xff7a3d }));
  scene.add(pathObj);
}
function startPose() {
  if (!pathPts.length) return { eye: [center.x + radius * 0.9, center.y + radius * 0.7, center.z + radius * 0.9], look: center.toArray() };
  const eye = pathPts[0].clone(); let k = Math.min(pathPts.length - 1, 1);
  for (let i = 1; i < pathPts.length; i++) { if (pathPts[i].distanceTo(pathPts[0]) > 1.5) { k = i; break; } }
  const dir = pathPts[k].clone().sub(eye); dir.y = 0; if (dir.length() < 0.05) dir.set(0, 0, -1); dir.normalize();
  return { eye: eye.toArray(), look: eye.clone().add(dir.multiplyScalar(4)).toArray() };
}
const sp = startPose();

const viewer = new GaussianSplats3D.Viewer({
  threeScene: scene,
  cameraUp: [0, 1, 0],
  initialCameraPosition: sp.eye,
  initialCameraLookAt: sp.look,
  sharedMemoryForWorkers: false,      // GitHub Pages 沒有 COOP/COEP 標頭，不能用 SharedArrayBuffer
  sceneRevealMode: GaussianSplats3D.SceneRevealMode.Instant,   // 預設會從原點（＝錄影起點）慢慢向外浮現，整條走廊一次顯示
  gpuAcceleratedSort: false,
  antialiased: true,
  splatSortDistanceMapPrecision: 16,
  focalAdjustment: 1.0,
});
viewer.renderer.setClearColor(bgColor(), 1);
window.__viewer = viewer;   // 方便在主控台檢查

function setCam(eye, look) { viewer.camera.position.set(eye[0], eye[1], eye[2]); viewer.controls.target.set(look[0], look[1], look[2]); viewer.controls.update(); }
document.getElementById('view-start').onclick = () => { const p = startPose(); setCam(p.eye, p.look); };
document.getElementById('view-reset').onclick = () => setCam([center.x + radius * 0.9, center.y + radius * 0.7, center.z + radius * 0.9], center.toArray());
document.getElementById('view-top').onclick = () => setCam([center.x, center.y + radius * 1.6, center.z + 0.01], center.toArray());
document.getElementById('tog-path').onclick = (e) => { const on = e.currentTarget.getAttribute('aria-pressed') !== 'true'; e.currentTarget.setAttribute('aria-pressed', String(on)); if (pathObj) pathObj.visible = on; };

const mq = window.matchMedia('(prefers-color-scheme: light)');
function paint() { const c = bgColor(); scene.background = c; viewer.renderer.setClearColor(c, 1); }
if (mq.addEventListener) mq.addEventListener('change', paint);
new MutationObserver(paint).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

try {
  await viewer.addSplatScene('oct06.splat', {
    format: GaussianSplats3D.SceneFormat.Splat,
    splatAlphaRemovalThreshold: 5,
    showLoadingUI: false,
    progressiveLoad: false,
    onProgress: (pct, msg, stage) => { statusEl.textContent = stage === 0 ? '下載 ' + Math.round(pct) + '%（21 MB）' : '處理中…'; },   // stage: 0 下載 1 處理 2 完成（LoaderStatus 沒匯出）
  });
  viewer.start();
  statusEl.textContent = ((meta ? meta.gaussians : 645503) / 10000).toFixed(1) + ' 萬個高斯';
  setTimeout(() => { statusEl.hidden = true; }, 2500);
} catch (e) {
  statusEl.textContent = '載入失敗：' + (e && e.message ? e.message : e);
}
</script>
</body>
</html>
