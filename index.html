<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oct06 走廊五種重建</title>
<style>
/* layout: full-viewport canvas, floating control card top-left, facts strip bottom; all numbers mono */
:root{
  --bg:#15191b; --panel:rgba(28,34,37,.92); --fg:#e8ecec; --muted:#9aa7a8; --line:#2f3a3d;
  --accent:#6fc3a6; --accent-fg:#0f1f1a; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef1f0; --panel:rgba(255,255,255,.94); --fg:#1c2420; --muted:#5d6b64; --line:#d6dedb; --accent:#1f6f5a; --accent-fg:#ffffff; color-scheme:light}}
:root[data-theme="light"]{--bg:#eef1f0; --panel:rgba(255,255,255,.94); --fg:#1c2420; --muted:#5d6b64; --line:#d6dedb; --accent:#1f6f5a; --accent-fg:#ffffff; color-scheme:light}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden}
#c{position:fixed;inset:0;display:block;touch-action:none}
.card{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));width:min(320px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;backdrop-filter:blur(6px);font-size:13px;line-height:1.5}
.card h1{font-size:15px;margin:0 0 2px;font-weight:600}
.card .sub{color:var(--muted);font-size:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row label{color:var(--muted);font-size:12px;min-width:56px}
button,a.btn{font:inherit;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;text-decoration:none;display:inline-block}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=range]{flex:1;min-width:90px;accent-color:var(--accent)}
#status{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12px;font-family:var(--mono)}
.hint{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:11px;text-align:right}
@media (max-width:480px){.hint{display:none}.card{font-size:12px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="card">
  <h1>Oct06_r001 走廊五種重建</h1>
  <div class="sub">海大走廊 · 推車去程 16.7 m、倒車回程 17.0 m（不迴轉）· 同一支 48 秒錄影</div>
  <div class="row"><label>資料</label>
    <button id="ds-cloud" aria-pressed="true">後處理點雲</button>
    <button id="ds-tex" aria-pressed="false">後處理貼圖網格 Raw</button>
    <button id="ds-texfill" aria-pressed="false">後處理貼圖網格 補點</button>
    <button id="ds-sdk" aria-pressed="false">即時資料修正貼圖網格</button>
    <a class="btn" href="splat.html">後處理高斯潑濺</a></div>
  <div class="row" id="lodrow"><label>解析度</label>
    <button id="lod-2" aria-pressed="true">2 cm · 122 萬點</button>
    <button id="lod-1" aria-pressed="false">1 cm · 560 萬點（約 66 MB）</button></div>
  <div class="row" id="sizerow"><label>點大小</label><input id="size" type="range" min="0.5" max="4" step="0.1" value="1.6"></div>
  <div class="row"><label>顯示</label>
    <button id="tog-path" aria-pressed="true">相機路徑</button>
    <button id="tog-floor" aria-pressed="false">隱藏地板</button>
    <button id="view-start">錄影起點</button>
    <button id="view-top">俯視</button>
    <button id="view-reset">重設視角</button></div>
</div>
<div id="status">載入中…</div>
<div class="hint">拖曳旋轉 · 右鍵/雙指平移 · 滾輪縮放</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  var canvas = document.getElementById('c');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(55, 1, 0.05, 500);
  var controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.dampingFactor = 0.08; controls.screenSpacePanning = true;
  var statusEl = document.getElementById('status');
  var modelObj = null, pathObj = null, center = new THREE.Vector3(), radius = 10, framed = false, pathPts = null, startApplied = false;
  var pointScale = 1.6, hideFloor = false, floorY = null, lod = '2', kind = 'cloud', token = 0, cloudVoxel = 0.02;

  function bgColor() { var v = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(); return new THREE.Color(v || '#15191b'); }
  function resize() { var w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  window.addEventListener('resize', resize); resize();

  var SRGB = new Float32Array(256);
  for (var i = 0; i < 256; i++) SRGB[i] = Math.pow(i / 255, 2.2);
  function decodeB64(b64) { var bin = atob(b64.trim()), len = bin.length, bytes = new Uint8Array(len); for (var b = 0; b < len; b++) bytes[b] = bin.charCodeAt(b); return bytes; }
  function dequant(q, n, mn, mx) {
    var pos = new Float32Array(n * 3), sx = (mx[0] - mn[0]) / 65535, sy = (mx[1] - mn[1]) / 65535, sz = (mx[2] - mn[2]) / 65535;
    for (var i = 0; i < n; i++) { pos[i * 3] = mn[0] + q[i * 3] * sx; pos[i * 3 + 1] = mn[1] + q[i * 3 + 1] * sy; pos[i * 3 + 2] = mn[2] + q[i * 3 + 2] * sz; }
    return pos;
  }
  function fetchText(name) { return fetch(name).then(function (r) { if (!r.ok) throw new Error(name + ' 讀取失敗'); return r.text(); }); }

  // floor-hiding shader patch shared by points and meshes (world y below uFloorY is discarded)
  function patchFloor(m) {
    m.onBeforeCompile = function (shader) {
      shader.uniforms.uFloorY = { value: hideFloor && floorY !== null ? floorY : -1e9 };
      shader.vertexShader = shader.vertexShader.replace('#include <common>', '#include <common>\nuniform float uFloorY; varying float vHide;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvHide = (position.y < uFloorY) ? 1.0 : 0.0;');
      shader.fragmentShader = shader.fragmentShader.replace('#include <common>', '#include <common>\nvarying float vHide;')
        .replace('#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\nif (vHide > 0.5) discard;');
      m.userData.shader = shader;
    };
    return m;
  }
  function estimateFloor(g) {
    var p = g.attributes.position.array, hist = new Map(), mn = Infinity;
    for (var i = 1; i < p.length; i += 21) { if (p[i] < mn) mn = p[i]; }
    for (var j = 1; j < p.length; j += 21) { var k = Math.round((p[j] - mn) / 0.05); hist.set(k, (hist.get(k) || 0) + 1); }
    var best = 0, bestK = 0; hist.forEach(function (v, k) { if (k < 20 && v > best) { best = v; bestK = k; } });
    return mn + bestK * 0.05 + 0.12;
  }
  function frame(meta) {
    if (framed) return; framed = true;
    var box = new THREE.Box3(new THREE.Vector3().fromArray(meta.min), new THREE.Vector3().fromArray(meta.max));
    box.getCenter(center); radius = box.getSize(new THREE.Vector3()).length() / 2;
    if (pathPts) { startView(); startApplied = true; } else resetView();
  }
  function clearModel() {
    if (modelObj) { scene.remove(modelObj); modelObj.traverse(function (c) { if (c.geometry) c.geometry.dispose(); if (c.material) { if (c.material.map) c.material.map.dispose(); c.material.dispose(); } }); modelObj = null; }
  }
  function setPressed(id, on) { document.getElementById(id).setAttribute('aria-pressed', String(on)); }
  function showFacts() {
    ['cloud', 'tex', 'texfill', 'sdk'].forEach(function (k) { setPressed('ds-' + k, k === kind); });
    document.getElementById('lodrow').hidden = (kind !== 'cloud'); document.getElementById('sizerow').hidden = (kind !== 'cloud');
  }

  function loadCloud(which) {
    var my = ++token; lod = which; setPressed('lod-2', which === '2'); setPressed('lod-1', which === '1');
    statusEl.hidden = false; statusEl.textContent = '載入中…'; clearModel();
    var key = which === '2' ? 'oct06' : 'oct06hq';
    return fetch(key + '_cloud.json').then(function (r) { return r.json(); }).then(function (meta) {
      if (my !== token) return; frame(meta); cloudVoxel = meta.voxel_m;
      if (!pathObj && meta.path && meta.path.length) {
        var pts = meta.path.map(function (p) { return new THREE.Vector3(p[0], p[1], p[2]); });
        pathObj = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xff7a3d }));
        pathObj.visible = document.getElementById('tog-path').getAttribute('aria-pressed') === 'true'; scene.add(pathObj);
        pathPts = pts; if (framed && !startApplied) { startView(); startApplied = true; }
      }
      var group = new THREE.Group(); modelObj = group; scene.add(group); var done = 0;
      return meta.chunks.reduce(function (chain, ch) {
        return chain.then(function () { return fetchText(ch.bin); }).then(function (b64) {
          if (my !== token) return;
          var bytes = decodeB64(b64), n = ch.n;
          var pos = dequant(new Uint16Array(bytes.buffer, 0, n * 3), n, meta.min, meta.max), c = bytes.subarray(n * 6, n * 9), col = new Float32Array(n * 3);
          for (var i = 0; i < n * 3; i++) col[i] = SRGB[c[i]];
          var g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
          if (floorY === null) floorY = estimateFloor(g);
          group.add(new THREE.Points(g, patchFloor(new THREE.PointsMaterial({ size: meta.voxel_m * pointScale, sizeAttenuation: true, vertexColors: true }))));
          done++; statusEl.textContent = '載入 ' + done + '/' + meta.chunks.length + ' 塊';
        });
      }, Promise.resolve()).then(function () {
        if (my !== token) return;
        statusEl.textContent = (meta.points / 10000).toFixed(0) + ' 萬點 · ' + Math.round(meta.voxel_m * 100) + ' cm';
        setTimeout(function () { if (my === token) statusEl.hidden = true; }, 2500);
      });
    });
  }

  function loadMesh(key) {
    var my = ++token; statusEl.hidden = false; statusEl.textContent = '載入中…'; clearModel();
    return fetch(key + '_mesh.json').then(function (r) { return r.json(); }).then(function (meta) {
      if (my !== token) return; frame(meta);
      var texPromise = meta.kind === 'tex' ? new Promise(function (res, rej) {
        new THREE.TextureLoader().load(meta.tex, function (t) { t.encoding = THREE.sRGBEncoding; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); res(t); }, undefined, function () { rej(new Error('貼圖讀取失敗')); });
      }) : Promise.resolve(null);
      return texPromise.then(function (tex) {
        var group = new THREE.Group(); modelObj = group; scene.add(group); var done = 0;
        return meta.chunks.reduce(function (chain, ch) {
          return chain.then(function () { return fetchText(ch.bin); }).then(function (b64) {
            if (my !== token) return;
            var bytes = decodeB64(b64), n = ch.n;
            var pos = dequant(new Uint16Array(bytes.buffer, 0, n * 3), n, meta.min, meta.max);
            var g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            var mat;
            if (meta.kind === 'tex') {
              var quv = new Uint16Array(bytes.buffer, n * 6, n * 2), uv = new Float32Array(n * 2);
              for (var i = 0; i < n * 2; i++) uv[i] = quv[i] / 65535;
              g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
              mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
            } else {
              var c = bytes.subarray(n * 6, n * 9), col = new Float32Array(n * 3);
              for (var j = 0; j < n * 3; j++) col[j] = SRGB[c[j]];
              g.setAttribute('color', new THREE.BufferAttribute(col, 3));
              mat = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide });
            }
            if (floorY === null) floorY = estimateFloor(g);
            group.add(new THREE.Mesh(g, patchFloor(mat)));
            done++; statusEl.textContent = '載入 ' + done + '/' + meta.chunks.length + ' 塊';
          });
        }, Promise.resolve());
      }).then(function () {
        if (my !== token) return;
        statusEl.textContent = (meta.triangles / 10000).toFixed(1) + ' 萬三角形';
        setTimeout(function () { if (my === token) statusEl.hidden = true; }, 2500);
      });
    });
  }

  function load() {
    showFacts();
    var p = kind === 'cloud' ? loadCloud(lod) : loadMesh(kind);
    p.catch(function (e) { statusEl.hidden = false; statusEl.textContent = '載入失敗：' + e.message; });
    // always have the camera path available (it lives in the 2 cm cloud manifest)
    if (!pathObj) fetch('oct06_cloud.json').then(function (r) { return r.json(); }).then(function (m) {
      if (pathObj || !m.path) return;
      var pts = m.path.map(function (q) { return new THREE.Vector3(q[0], q[1], q[2]); });
      pathObj = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xff7a3d }));
      pathObj.visible = document.getElementById('tog-path').getAttribute('aria-pressed') === 'true'; scene.add(pathObj);
      pathPts = pts; if (framed && !startApplied) { startView(); startApplied = true; }
    }).catch(function () {});
  }
  function startView() {
    if (!pathPts || !pathPts.length) { resetView(); return; }
    var eye = pathPts[0].clone(), k = Math.min(pathPts.length - 1, 1);
    for (var i = 1; i < pathPts.length; i++) { if (pathPts[i].distanceTo(pathPts[0]) > 1.5) { k = i; break; } }
    var dir = pathPts[k].clone().sub(eye); dir.y = 0;
    if (dir.length() < 0.05) dir.set(0, 0, -1); dir.normalize();
    camera.position.copy(eye); controls.target.copy(eye.clone().add(dir.multiplyScalar(4))); controls.update();
  }
  function resetView() { camera.position.set(center.x + radius * 0.9, center.y + radius * 0.7, center.z + radius * 0.9); controls.target.copy(center); controls.update(); }
  function topView() { camera.position.set(center.x, center.y + radius * 1.6, center.z + 0.01); controls.target.copy(center); controls.update(); }
  function applyFloor() { if (!modelObj) return; modelObj.traverse(function (o) { var sh = o.material && o.material.userData.shader; if (sh) sh.uniforms.uFloorY.value = hideFloor && floorY !== null ? floorY : -1e9; }); }

  document.getElementById('ds-cloud').onclick = function () { kind = 'cloud'; load(); };
  document.getElementById('ds-tex').onclick = function () { kind = 'tex'; load(); };
  document.getElementById('ds-texfill').onclick = function () { kind = 'texfill'; load(); };
  document.getElementById('ds-sdk').onclick = function () { kind = 'sdk'; load(); };
  document.getElementById('lod-2').onclick = function () { lod = '2'; load(); };
  document.getElementById('lod-1').onclick = function () { lod = '1'; load(); };
  document.getElementById('size').oninput = function (e) {
    pointScale = parseFloat(e.target.value);
    if (modelObj && kind === 'cloud') modelObj.traverse(function (o) { if (o.isPoints) o.material.size = cloudVoxel * pointScale; });
  };
  document.getElementById('tog-path').onclick = function (e) { var on = e.currentTarget.getAttribute('aria-pressed') !== 'true'; e.currentTarget.setAttribute('aria-pressed', String(on)); if (pathObj) pathObj.visible = on; };
  document.getElementById('tog-floor').onclick = function (e) { hideFloor = e.currentTarget.getAttribute('aria-pressed') !== 'true'; e.currentTarget.setAttribute('aria-pressed', String(hideFloor)); applyFloor(); };
  document.getElementById('view-start').onclick = startView;
  document.getElementById('view-top').onclick = topView;
  document.getElementById('view-reset').onclick = resetView;

  var mq = window.matchMedia('(prefers-color-scheme: light)');
  function paint() { scene.background = bgColor(); }
  if (mq.addEventListener) mq.addEventListener('change', paint); paint();
  new MutationObserver(paint).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  (function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); })();
  load();
})();
</script>

</body>
</html>
